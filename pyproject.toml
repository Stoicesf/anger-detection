[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anger-detection"
version = "0.4.0"
description = "Chinese speech anger detection (DS-CNN) — train, evaluate, realtime demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stoicesf" }]
dependencies = [
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile",
  "onnxruntime>=1.16",
  "streamlit>=1.33",
  "sounddevice",
]

[project.optional-dependencies]
train = [
  "torch",
  "torchaudio",
  "scikit-learn",
  "pandas",
  "pyarrow",
  "onnx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anger_detection = ["py.typed"]
